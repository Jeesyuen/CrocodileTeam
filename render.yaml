# Render Blueprint: one web service that serves the React app, the API and the live-alert WebSocket.
# Render dashboard → New → Blueprint → pick this repository. You'll be asked for the secrets marked `sync: false`.
#
# Plan: "free". The instance sleeps after 15 minutes idle (the next visit takes about a minute) and the database,
# photos and trained model live inside the container, so everything resets to the demo data on each restart.
# To keep data and never sleep, switch to `plan: starter` and add a disk plus the matching paths:
#     disk: { name: saferoute-data, mountPath: /var/data, sizeGB: 1 }
#     DATABASE_URL=sqlite:////var/data/saferoute.db  UPLOAD_DIR=/var/data/uploads  MODEL_DIR=/var/data/models
services:
  - type: web
    name: saferoute-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
