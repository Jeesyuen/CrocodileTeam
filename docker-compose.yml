# Optional: run SafeRoute AI with PostgreSQL/PostGIS.
#   docker compose up --build
# Frontend: http://localhost:5173  ·  API: http://localhost:8000/docs
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: saferoute
      POSTGRES_PASSWORD: saferoute
      POSTGRES_DB: saferoute
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saferoute"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://saferoute:saferoute@db:5432/saferoute
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173
      DEMO_MODE: "true"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
